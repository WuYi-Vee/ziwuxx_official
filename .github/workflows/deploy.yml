name: deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH key + Deploy
        run: |
          set -e

          mkdir -p ~/.ssh

          # 写入私钥（从 base64 还原）
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 预先信任服务器主机指纹（避免首次连接卡住）
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

          # 执行远程部署脚本
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -eu

            APP_DIR="/var/www/mysite/ziwuxx_official"
            cd "$APP_DIR"

            git fetch --all
            git reset --hard origin/main

            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            pm2 restart ziwuxx-api || pm2 start server.js --name ziwuxx-api
            pm2 save

            curl -I --max-time 5 http://127.0.0.1:3000 || true
          EOF
