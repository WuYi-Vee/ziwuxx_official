name: deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            bash -lc '
            set -eu

            echo "== basic info =="
            whoami
            pwd

            echo "== go to project =="
            APP_DIR="/var/www/mysite/ziwuxx_official"
            test -d "$APP_DIR"
            cd "$APP_DIR"
            echo "Now in: $(pwd)"
            ls -la

            echo "== git update =="
            git fetch --all
            git reset --hard origin/main

            echo "== install deps =="
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            echo "== restart pm2 =="
            pm2 restart ziwuxx-api || pm2 start server.js --name ziwuxx-api
            pm2 save

            echo "== health check =="
            curl -I --max-time 5 http://127.0.0.1:3000 || true
            '
